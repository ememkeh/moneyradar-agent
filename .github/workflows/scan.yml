name: MoneyRadar Scan

on:
  schedule:
    # Every 2 hours at :17 past (odd minute = less GitHub queue delay than :00)
    - cron: "17 */2 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write  # needed so the workflow can commit the updated seen_posts.json back to the repo

# Never run two scans at once — a second one waits for the first to finish
# (stops both trying to save seen_posts.json and causing duplicate alerts)
concurrency:
  group: moneyradar-scan
  cancel-in-progress: false

jobs:
  scan:
    # Pinned instead of ubuntu-latest, which switches to Ubuntu 26 on Oct 19, 2026
    runs-on: ubuntu-24.04
    # A stuck run gets cancelled after 30 min instead of hanging for hours
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MoneyRadar scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit updated seen_posts.json
        # Runs even if the scan step failed partway, so posts already
        # alerted on are still saved and don't get re-sent next run
        if: always()
        run: |
          git config --global user.name "MoneyRadar Bot"
          git config --global user.email "actions@github.com"
          git add seen_posts.json
          git diff --staged --quiet && exit 0
          git commit -m "Update seen posts [skip ci]"
          # If you edited a file while the scan was running, merge that first
          git pull --rebase origin main || true
          git push
